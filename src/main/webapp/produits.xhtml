<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head><title>Vitrine</title></h:head>
<h:body>
  <h2>#{vitrineBean.vitrine.nom}</h2>

  <h:form>
    <h:link value="Vitrine" outcome="produits"/> |
    <h:link value="Ajouter un produit" outcome="ajouter"/> |
    <h:link value="Mon panier" outcome="panier"/> |
    <h:link value="Inscription" outcome="inscription" rendered="#{!internauteBean.connecte}"/>
    <h:link value="Connexion" outcome="connexion" rendered="#{!internauteBean.connecte}"/>
    <h:outputText value="Bonjour #{internauteBean.utilisateur.prenom} " rendered="#{internauteBean.connecte}"/>
    <h:commandLink value="Déconnexion" action="#{internauteBean.deconnecter}" rendered="#{internauteBean.connecte}"/>
  </h:form>
  <hr/>

  <h:messages/>
  <h:form>
    <h:dataTable value="#{vitrineBean.produits}" var="p" border="1" cellpadding="5">
      <h:column><f:facet name="header">Nom</f:facet>#{p.nom}</h:column>
      <h:column><f:facet name="header">Description</f:facet>#{p.description}</h:column>
      <h:column><f:facet name="header">Prix</f:facet>#{p.prix} MAD</h:column>
      <h:column><f:facet name="header">Stock</f:facet>#{p.stock}</h:column>
      <h:column>
        <h:commandButton value="Ajouter au panier" action="#{panierBean.ajouterProduit(p)}"/>
        <h:commandButton value="Supprimer" action="#{vitrineBean.supprimer(p)}"/>
      </h:column>
    </h:dataTable>
  </h:form>
</h:body>
</html>
