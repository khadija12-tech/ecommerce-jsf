<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head><title>Ajouter un produit</title></h:head>
<h:body>
  <h2>Ajouter un produit</h2>
  <h:messages/>
  <h:form>
    <h:panelGrid columns="2">
      <h:outputLabel value="Nom"/>
      <h:inputText value="#{vitrineBean.produit.nom}"/>
      <h:outputLabel value="Description"/>
      <h:inputText value="#{vitrineBean.produit.description}"/>
      <h:outputLabel value="Prix (MAD)"/>
      <h:inputText value="#{vitrineBean.produit.prix}"/>
      <h:outputLabel value="Stock"/>
      <h:inputText value="#{vitrineBean.produit.stock}"/>
    </h:panelGrid>
    <h:commandButton value="Enregistrer" action="#{vitrineBean.ajouter}"/>
    <h:link value="Retour" outcome="produits"/>
  </h:form>
</h:body>
</html>
