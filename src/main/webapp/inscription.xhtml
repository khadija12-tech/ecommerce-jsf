<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head><title>Inscription</title></h:head>
<h:body>
  <h2>Inscription</h2>
  <h:messages/>
  <h:form>
    <h:panelGrid columns="2">
      <h:outputLabel value="Nom"/>
      <h:inputText value="#{internauteBean.internaute.nom}"/>
      <h:outputLabel value="Prénom"/>
      <h:inputText value="#{internauteBean.internaute.prenom}"/>
      <h:outputLabel value="Email"/>
      <h:inputText value="#{internauteBean.internaute.email}"/>
      <h:outputLabel value="Mot de passe"/>
      <h:inputSecret value="#{internauteBean.internaute.motDePasse}"/>
      <h:outputLabel value="Adresse"/>
      <h:inputText value="#{internauteBean.internaute.adresse}"/>
    </h:panelGrid>
    <h:commandButton value="S'inscrire" action="#{internauteBean.inscrire}"/>
    <h:link value="Retour" outcome="produits"/>
  </h:form>
</h:body>
</html>
